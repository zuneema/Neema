<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        /* (Keep all the CSS from previous code, it's already good) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .clock {
            font-size: 1.2em;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            margin-top: 10px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
        }

        .config-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .config-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .btn-config {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .connection-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .connected {
            background: #28a745;
            color: white;
        }

        .disconnected {
            background: #dc3545;
            color: white;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        /* ... rest of the CSS remains the same ... */
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Student Management System</h1>
            <div class="clock" id="liveClock"></div>
        </header>
        
        <div class="config-section">
            <div class="config-box">
                <h3>⚙️ Configuration</h3>
                <input type="text" id="webAppUrl" class="config-input" 
                       placeholder="Enter your Web App URL here" 
                       value="https://script.google.com/macros/s/">
                <button class="btn-config" onclick="testConnection()">Test Connection</button>
                <span id="connectionStatus" class="connection-status disconnected">Not Connected</span>
            </div>
        </div>
        
        <div class="main-content">
            <section class="form-section">
                <div class="card">
                    <h2>📝 Add/Edit Student</h2>
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" required placeholder="Enter full name">
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" required placeholder="Enter phone number">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" required placeholder="Enter email address">
                        </div>
                        
                        <div class="form-group">
                            <label for="course">Course *</label>
                            <select id="course" required>
                                <option value="">Select Course</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Business">Business</option>
                                <option value="Arts">Arts</option>
                                <option value="Medicine">Medicine</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="query">Query/Question</label>
                            <textarea id="query" rows="3" placeholder="Enter any queries or questions"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">💾 Save Student</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">🗑️ Clear Form</button>
                    </form>
                </div>
            </section>
            
            <section class="list-section">
                <div class="card">
                    <h2>📊 Student Records</h2>
                    
                    <div class="filters">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="🔍 Search students...">
                        </div>
                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadStudents()">🔄 Refresh</button>
                    </div>
                    
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Loading students...</p>
                    </div>
                    
                    <div id="errorMessage" class="error-message" style="display: none;">
                        <p>⚠️ Error loading data. Please check your connection.</p>
                    </div>
                    
                    <div class="table-container">
                        <table id="studentsTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Course</th>
                                    <th>Query</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTableBody">
                                <!-- Data will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>

    <script>
        // Web App URL - User will configure this
        let WEB_APP_URL = localStorage.getItem('webAppUrl') || '';
        if (WEB_APP_URL) {
            document.getElementById('webAppUrl').value = WEB_APP_URL;
        }
        
        // Live Clock
        function updateClock() {
            const now = new Date();
            const clock = document.getElementById('liveClock');
            clock.textContent = now.toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }
        
        setInterval(updateClock, 1000);
        updateClock();
        
        // Show Notification
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Test Connection
        async function testConnection() {
            WEB_APP_URL = document.getElementById('webAppUrl').value.trim();
            
            if (!WEB_APP_URL) {
                showNotification('Please enter a Web App URL', 'error');
                return;
            }
            
            // Save to localStorage
            localStorage.setItem('webAppUrl', WEB_APP_URL);
            
            const statusEl = document.getElementById('connectionStatus');
            statusEl.textContent = 'Testing...';
            statusEl.className = 'connection-status';
            
            try {
                const response = await fetch(`${WEB_APP_URL}?method=test`);
                const result = await response.json();
                
                if (result.success) {
                    statusEl.textContent = 'Connected';
                    statusEl.className = 'connection-status connected';
                    showNotification('✓ Connection successful! Sheet: ' + result.sheetName, 'success');
                    
                    // Load students after successful connection
                    loadStudents();
                } else {
                    statusEl.textContent = 'Failed';
                    statusEl.className = 'connection-status disconnected';
                    showNotification('✗ Connection failed: ' + result.message, 'error');
                }
            } catch (error) {
                statusEl.textContent = 'Error';
                statusEl.className = 'connection-status disconnected';
                showNotification('✗ Connection error: ' + error.message, 'error');
            }
        }
        
        // Form Submission
        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!WEB_APP_URL) {
                showNotification('Please configure Web App URL first', 'error');
                return;
            }
            
            const formData = {
                method: 'add',
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                course: document.getElementById('course').value,
                query: document.getElementById('query').value,
                status: document.getElementById('status').value
            };
            
            const studentId = document.getElementById('studentId').value;
            if (studentId) {
                formData.method = 'update';
                formData.id = studentId;
            }
            
            try {
                showNotification('Saving student...', 'success');
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('✓ ' + result.message, 'success');
                    resetForm();
                    loadStudents();
                } else {
                    showNotification('✗ ' + result.message, 'error');
                }
            } catch (error) {
                showNotification('✗ Error saving student: ' + error.message, 'error');
            }
        });
        
        // Load Students
        async function loadStudents() {
            if (!WEB_APP_URL) {
                showNotification('Please configure Web App URL first', 'error');
                return;
            }
            
            const loading = document.getElementById('loading');
            const tableBody = document.getElementById('studentsTableBody');
            const errorMessage = document.getElementById('errorMessage');
            
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            tableBody.innerHTML = '';
            
            try {
                const response = await fetch(`${WEB_APP_URL}?method=get`);
                const result = await response.json();
                
                if (result.success) {
                    displayStudents(result.students);
                    if (result.count === 0) {
                        showNotification('No students found. Add your first student!', 'success');
                    }
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.innerHTML = `<p>⚠️ ${result.message}</p>`;
                }
            } catch (error) {
                errorMessage.style.display = 'block';
                errorMessage.innerHTML = `<p>⚠️ Error loading students: ${error.message}</p>`;
                showNotification('✗ Error loading students', 'error');
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // Display Students
        function displayStudents(students) {
            const tableBody = document.getElementById('studentsTableBody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            tableBody.innerHTML = '';
            
            if (!students || students.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="10" style="text-align: center; padding: 40px;">
                            <p>No students found. Add your first student!</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            let displayedCount = 0;
            
            students.forEach(student => {
                // Apply filters
                if (searchTerm) {
                    const searchable = [
                        student.name || '',
                        student.phone || '',
                        student.Email || '',
                        student.Course || '',
                        student.Query || ''
                    ].some(value => value.toString().toLowerCase().includes(searchTerm));
                    
                    if (!searchable) return;
                }
                
                if (statusFilter && student.Status !== statusFilter) {
                    return;
                }
                
                displayedCount++;
                
                const statusClass = student.Status ? 
                    student.Status.toLowerCase().replace(' ', '') : 'pending';
                
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${student.id || ''}</td>
                    <td>${student.name || ''}</td>
                    <td>${student.phone || ''}</td>
                    <td>${student.Email || ''}</td>
                    <td>${student.Course || ''}</td>
                    <td>${student.Query || ''}</td>
                    <td><span class="status status-${statusClass}">${student.Status || 'Pending'}</span></td>
                    <td>${student.Date || ''}</td>
                    <td>${student.Timestamp || ''}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-small btn-edit" onclick="editStudent(${student.id})">Edit</button>
                            <button class="btn-small btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
            
            if (displayedCount === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="10" style="text-align: center; padding: 40px;">
                            <p>No students match your search criteria.</p>
                        </td>
                    </tr>
                `;
            }
        }
        
        // Edit Student
        async function editStudent(id) {
            try {
                const response = await fetch(`${WEB_APP_URL}?method=get`);
                const result = await response.json();
                
                if (result.success) {
                    const student = result.students.find(s => s.id == id);
                    if (student) {
                        document.getElementById('studentId').value = student.id;
                        document.getElementById('name').value = student.name || '';
                        document.getElementById('phone').value = student.phone || '';
                        document.getElementById('email').value = student.Email || '';
                        document.getElementById('course').value = student.Course || '';
                        document.getElementById('query').value = student.Query || '';
                        document.getElementById('status').value = student.Status || 'Pending';
                        
                        showNotification(`Editing student: ${student.name || 'ID ' + id}`, 'success');
                    }
                }
            } catch (error) {
                showNotification('Error loading student details', 'error');
            }
        }
        
        // Delete Student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) {
                return;
            }
            
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        method: 'delete',
                        id: id
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('✓ ' + result.message, 'success');
                    loadStudents();
                } else {
                    showNotification('✗ ' + result.message, 'error');
                }
            } catch (error) {
                showNotification('✗ Error deleting student', 'error');
            }
        }
        
        // Reset Form
        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            showNotification('Form cleared', 'success');
        }
        
        // Search and Filter
        document.getElementById('searchInput').addEventListener('input', loadStudents);
        document.getElementById('statusFilter').addEventListener('change', loadStudents);
        
        // Auto-test connection if URL is already saved
        if (WEB_APP_URL) {
            setTimeout(testConnection, 1000);
        }
    </script>
</body>
</html>
