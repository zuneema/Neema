<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .clock {
            font-size: 2em;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        .form-section, .list-section {
            flex: 1;
            min-width: 300px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #4facfe;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }

        .status-inprogress {
            background-color: #cce5ff;
            color: #004085;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-edit {
            background-color: #17a2b8;
            color: white;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.3s;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        .notification.success {
            background-color: #28a745;
        }

        .notification.error {
            background-color: #dc3545;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .filters {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Student Management System</h1>
            <div class="clock" id="liveClock"></div>
        </header>
        
        <div class="main-content">
            <section class="form-section">
                <div class="card">
                    <h2>Add/Edit Student</h2>
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="course">Course *</label>
                            <select id="course" required>
                                <option value="">Select Course</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Business">Business</option>
                                <option value="Arts">Arts</option>
                                <option value="Medicine">Medicine</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="query">Query/Question</label>
                            <textarea id="query" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Save Student</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear Form</button>
                    </form>
                </div>
            </section>
            
            <section class="list-section">
                <div class="card">
                    <h2>Student Records</h2>
                    
                    <div class="filters">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="Search students...">
                        </div>
                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Loading students...</p>
                    </div>
                    
                    <div class="table-container">
                        <table id="studentsTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Course</th>
                                    <th>Query</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTableBody">
                                <!-- Data will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>

    <script>
        // Replace with your Web App URL after deploying the Google Apps Script
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzQIK-rA8_0afHSXM6AmQ6QookeFAQGa-JQypSxf5-QervqgGb49s--oANVE8vuXi_k/exec';
        
        // Live Clock
        function updateClock() {
            const now = new Date();
            const clock = document.getElementById('liveClock');
            clock.textContent = now.toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }
        
        setInterval(updateClock, 1000);
        updateClock();
        
        // Show Notification
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Form Submission
        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                method: 'add',
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                course: document.getElementById('course').value,
                query: document.getElementById('query').value,
                status: document.getElementById('status').value
            };
            
            const studentId = document.getElementById('studentId').value;
            if (studentId) {
                formData.method = 'update';
                formData.id = studentId;
            }
            
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                    resetForm();
                    loadStudents();
                } else {
                    showNotification(result.message, 'error');
                }
            } catch (error) {
                showNotification('Error saving student: ' + error.message, 'error');
            }
        });
        
        // Load Students
        async function loadStudents() {
            const loading = document.getElementById('loading');
            const tableBody = document.getElementById('studentsTableBody');
            
            loading.style.display = 'block';
            tableBody.innerHTML = '';
            
            try {
                const response = await fetch(`${WEB_APP_URL}?method=get`);
                const result = await response.json();
                
                if (result.success) {
                    displayStudents(result.students);
                }
            } catch (error) {
                showNotification('Error loading students', 'error');
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // Display Students
        function displayStudents(students) {
            const tableBody = document.getElementById('studentsTableBody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            tableBody.innerHTML = '';
            
            students.forEach(student => {
                // Apply filters
                if (searchTerm && !Object.values(student).some(value => 
                    value.toString().toLowerCase().includes(searchTerm))) {
                    return;
                }
                
                if (statusFilter && student.Status !== statusFilter) {
                    return;
                }
                
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${student.id || ''}</td>
                    <td>${student.name || ''}</td>
                    <td>${student.phone || ''}</td>
                    <td>${student.Email || ''}</td>
                    <td>${student.Course || ''}</td>
                    <td>${student.Query || ''}</td>
                    <td><span class="status status-${student.Status?.toLowerCase().replace(' ', '')}">${student.Status || 'Pending'}</span></td>
                    <td>${student.Date || ''}</td>
                    <td>${student.Timestamp || ''}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-small btn-edit" onclick="editStudent(${student.id})">Edit</button>
                            <button class="btn-small btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
        }
        
        // Edit Student
        function editStudent(id) {
            // Fetch student details and populate form
            // You can implement this by fetching all students and finding the matching ID
            // Or create a new endpoint in Apps Script to fetch single student
            showNotification('Edit functionality to be implemented', 'success');
        }
        
        // Delete Student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) {
                return;
            }
            
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        method: 'delete',
                        id: id
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                    loadStudents();
                } else {
                    showNotification(result.message, 'error');
                }
            } catch (error) {
                showNotification('Error deleting student', 'error');
            }
        }
        
        // Reset Form
        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
        }
        
        // Search and Filter
        document.getElementById('searchInput').addEventListener('input', loadStudents);
        document.getElementById('statusFilter').addEventListener('change', loadStudents);
        
        // Initial Load
        document.addEventListener('DOMContentLoaded', loadStudents);
    </script>
</body>
</html>
